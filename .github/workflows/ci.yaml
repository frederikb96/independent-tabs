# Pull requests only: main takes nothing but rebase merges of a branch that passed `CI ok` with
# the up-to-date requirement, so a run on main would repeat the tree that was just tested.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vendored libraries match package.json
        run: |
          bun run vendor
          git diff --exit-code -- fuse.min.js sortable.min.js

      - name: Manifest, changelog and extension files agree
        run: bun run check

      - name: Unit tests
        run: bun run test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright-core install chromium

      - name: Browser tests
        run: bun run test:e2e

  ci-ok:
    name: CI ok
    needs: [checks, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
