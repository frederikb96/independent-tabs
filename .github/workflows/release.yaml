name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag, manifest and changelog must agree
        run: bun scripts/check-release.js "$GITHUB_REF_NAME"

      - name: Unit tests
        run: bun run test

      - name: Cut the release notes from the changelog
        run: bun scripts/extract-changelog.js "$GITHUB_REF_NAME" > release-notes.md

      - name: Build the extension zip
        run: bun scripts/package.js "independent-tabs-$GITHUB_REF_NAME.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: independent-tabs-${{ github.ref_name }}.zip
          body_path: release-notes.md
